name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  repository_dispatch:
    types: [response_time]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@v1.43.8
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          # 只交出 .upptimerc.yml 用到的網址鑰匙：整包 toJson(secrets) 自 2026-08-30 起被 GitHub 判為疑似惡意、排程不執行（比照上游 v1.44.1）
          SECRETS_CONTEXT: '{"HIDDEN_SITE_01":${{ toJson(secrets.HIDDEN_SITE_01) }},"HIDDEN_SITE_02":${{ toJson(secrets.HIDDEN_SITE_02) }},"HIDDEN_SITE_03":${{ toJson(secrets.HIDDEN_SITE_03) }},"HIDDEN_SITE_04":${{ toJson(secrets.HIDDEN_SITE_04) }},"HIDDEN_SITE_05":${{ toJson(secrets.HIDDEN_SITE_05) }},"HIDDEN_SITE_06":${{ toJson(secrets.HIDDEN_SITE_06) }},"HIDDEN_SITE_07":${{ toJson(secrets.HIDDEN_SITE_07) }},"HIDDEN_SITE_08":${{ toJson(secrets.HIDDEN_SITE_08) }},"HIDDEN_SITE_09":${{ toJson(secrets.HIDDEN_SITE_09) }},"HIDDEN_SITE_10":${{ toJson(secrets.HIDDEN_SITE_10) }},"HIDDEN_SITE_11":${{ toJson(secrets.HIDDEN_SITE_11) }},"HIDDEN_SITE_12":${{ toJson(secrets.HIDDEN_SITE_12) }},"HIDDEN_SITE_13":${{ toJson(secrets.HIDDEN_SITE_13) }},"HIDDEN_SITE_14":${{ toJson(secrets.HIDDEN_SITE_14) }},"HIDDEN_SITE_15":${{ toJson(secrets.HIDDEN_SITE_15) }},"HIDDEN_SITE_16":${{ toJson(secrets.HIDDEN_SITE_16) }},"HIDDEN_SITE_17":${{ toJson(secrets.HIDDEN_SITE_17) }},"HIDDEN_SITE_18":${{ toJson(secrets.HIDDEN_SITE_18) }},"HIDDEN_SITE_19":${{ toJson(secrets.HIDDEN_SITE_19) }},"HIDDEN_SITE_20":${{ toJson(secrets.HIDDEN_SITE_20) }},"HIDDEN_SITE_21":${{ toJson(secrets.HIDDEN_SITE_21) }},"HIDDEN_SITE_22":${{ toJson(secrets.HIDDEN_SITE_22) }},"HIDDEN_SITE_23":${{ toJson(secrets.HIDDEN_SITE_23) }},"HIDDEN_SITE_24":${{ toJson(secrets.HIDDEN_SITE_24) }}}'
